name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies and sync web assets
        working-directory: sediment
        run: |
          npm install
          npx cap sync android

      - name: Build debug APK
        working-directory: sediment/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename debug APK
        run: cp sediment/android/app/build/outputs/apk/debug/app-debug.apk sediment-debug.apk

      - name: Upload sediment-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: sediment-debug-apk
          path: sediment-debug.apk
          if-no-files-found: error
