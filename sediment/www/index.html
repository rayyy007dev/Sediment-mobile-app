<body>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="sky"></canvas>
<button class="glass theme" id="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
<button class="glass skybtn" id="skyBtn" aria-pressed="false" hidden>✦ Sky</button>

<main>
  <header>
    <h1 id="hello">Hello.</h1>
    <p class="sub" id="sub"></p>
    <p class="note" id="note" hidden></p>
  </header>

  <div class="glass add">
    <input id="in" type="text" placeholder="Add something…" autocomplete="off" aria-label="New task">
    <button id="addBtn" aria-label="Add task">+</button>
  </div>

  <ul id="open"></ul>

  <details class="glass arch" id="noteWrap" open>
    <summary id="noteSum">Note to tomorrow</summary>
    <textarea id="box" spellcheck="false" maxlength="600" aria-label="Note to tomorrow" placeholder="What should tomorrow-you remember, finish or feel?"></textarea>
    <div class="row">
      <button class="link" id="leave">Leave note</button>
      <span class="msg" id="bmsg">It greets you here tomorrow. Ctrl+Enter also works.</span>
    </div>
    <ul id="notes"></ul>
  </details>

  <details class="glass arch" id="archWrap">
    <summary id="archSum"></summary>
    <ul id="done"></ul>
    <div class="bk">
      <div class="row bk-actions">
        <button class="link" id="copy">Copy backup</button>
        <button class="link" id="save">Save backup</button>
        <button class="link" id="clearDone" disabled>Delete completed</button>
        <button class="link" id="restoreBtn">Restore backup</button>
      </div>
      <div class="confirm-bar" id="clearConfirm" hidden>
        <span class="msg" id="clearPrompt"></span>
        <div class="row">
          <button class="link danger" id="clearYes">Yes, delete</button>
          <button class="link" id="clearNo">Cancel</button>
        </div>
      </div>
      <p class="msg bk-msg" id="msg">A backup holds your tasks and notes.</p>
      <div id="rbox" hidden>
        <textarea id="rtext" spellcheck="false" aria-label="Paste backup" placeholder="Paste your backup text here."></textarea>
        <div class="row"><button class="link" id="restoreGo">Restore now</button><button class="link" id="restoreX">Cancel</button></div>
      </div>
    </div>
  </details>
</main>

<div id="tip"><b id="tipText"></b><small id="tipDate"></small><button class="link" id="reopen">Reopen task</button></div>
<footer class="foot"><p class="hint" id="hint"></p></footer>

<script>
(function(){
  var KEY="sediment.v1",mem=null,tasks=[],hover=null,pinned=null,cache={},starCol="#fff";
  var $=function(i){return document.getElementById(i)};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,coarse=matchMedia("(pointer:coarse)").matches;

  function read(){try{var r=localStorage.getItem(KEY),d=r?JSON.parse(r):null;if(Array.isArray(d))return d}catch(e){}try{var m=mem?JSON.parse(mem):null;if(Array.isArray(m))return m}catch(e){}return[]}
  function write(){var s=JSON.stringify(tasks);mem=s;try{localStorage.setItem(KEY,s)}catch(e){}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function ago(ts){var m=Math.floor((Date.now()-ts)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.floor(m/60);if(h<24)return h+(h===1?" hour ago":" hours ago");var d=Math.floor(h/24);return d+(d===1?" day ago":" days ago")}
  function dateLabel(ts){return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})}

  /* ---------- sky ---------- */
  var cv=$("sky"),cx=cv.getContext("2d"),W=0,H=0,glowCan=document.createElement("canvas"),glowSize=48,scrolling=false,scrollT=0;
  glowCan.width=glowCan.height=glowSize;
  var dust=(function(){var r=rng(7),a=[];for(var i=0;i<150;i++)a.push({x:r(),y:r(),s:.4+r()*.9,p:r()*6.28});return a})();
  function size(){var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(d,0,0,d,0,0);if(ready)draw(performance.now())}
  function buildGlow(){
    var gx=glowCan.getContext("2d"),c=glowSize/2,g=gx.createRadialGradient(c,c,0,c,c,c);
    gx.clearRect(0,0,glowSize,glowSize);g.addColorStop(0,starCol);g.addColorStop(.28,starCol);g.addColorStop(1,"rgba(0,0,0,0)");
    gx.globalAlpha=.45;gx.fillStyle=g;gx.beginPath();gx.arc(c,c,c,0,6.283);gx.fill();gx.globalAlpha=1;
  }
  function refreshCol(){starCol=getComputedStyle(document.documentElement).getPropertyValue("--star").trim()||"#fff";buildGlow()}
  function pos(t){if(!cache[t.id]){var r=rng(hash(t.id));cache[t.id]={x:.06+.88*r(),y:.09+.80*r(),s:2.4+r()*2.2,p:r()*6.28}}return cache[t.id]}
  function stars(){return tasks.filter(function(t){return t.done}).sort(function(a,b){return a.done-b.done})}

  function draw(t){
    cx.clearRect(0,0,W,H);cx.fillStyle=starCol;cx.strokeStyle=starCol;
    dust.forEach(function(d){cx.globalAlpha=.12+.22*(.5+.5*Math.sin(t*.0008+d.p));cx.beginPath();cx.arc(d.x*W,d.y*H,d.s,0,6.283);cx.fill()});
    var list=stars(),blooming=false,now=Date.now();
    cx.globalAlpha=.17;cx.lineWidth=1;cx.beginPath();
    list.forEach(function(s,i){var p=pos(s);i?cx.lineTo(p.x*W,p.y*H):cx.moveTo(p.x*W,p.y*H)});
    cx.stroke();
    list.forEach(function(s){
      var p=pos(s),age=now-s.done,boost=age<2500?1+3*Math.exp(-age/500):1,r=p.s*boost,gr=r*4.5;
      if(age<2500)blooming=true;
      cx.globalAlpha=.82+.18*Math.sin(t*.002+p.p);
      cx.drawImage(glowCan,p.x*W-gr,p.y*H-gr,gr*2,gr*2);
      cx.beginPath();cx.arc(p.x*W,p.y*H,r,0,6.283);cx.fill();
    });
    var hl=pinned||hover;
    if(hl){var s=tasks.find(function(x){return x.id===hl});if(s&&s.done){var p=pos(s);cx.globalAlpha=.6;cx.lineWidth=1.2;cx.beginPath();cx.arc(p.x*W,p.y*H,p.s+8,0,6.283);cx.stroke()}}
    cx.globalAlpha=1;
    return blooming;
  }
  var last=0,blooming=false;
  function loop(t){
    var step=blooming?24:(document.body.classList.contains("sky")?34:80);
    if(!scrolling&&t-last>=step){last=t;blooming=draw(t)}
    if(!reduce)requestAnimationFrame(loop);
  }
  addEventListener("scroll",function(){if(!scrolling){scrolling=true;document.body.classList.add("scrolling")}clearTimeout(scrollT);scrollT=setTimeout(function(){scrolling=false;document.body.classList.remove("scrolling")},140)},{passive:true,capture:true});

  function hit(mx,my){var best=null,bd=coarse?30:18;stars().forEach(function(s){var p=pos(s),d=Math.hypot(p.x*W-mx,p.y*H-my);if(d<bd){bd=d;best=s}});return best}
  function showTip(s,pin){
    var p=pos(s),tip=$("tip"),y=p.y*H,below=y<110;
    $("tipText").textContent=s.text;$("tipDate").textContent="Finished "+dateLabel(s.done);
    $("reopen").style.display=pin?"":"none";
    tip.className=(pin?"pin ":"")+(below?"below":"");
    tip.style.left=Math.min(Math.max(p.x*W,140),Math.max(140,W-140))+"px";
    tip.style.top=(below?y+16:y-16)+"px";tip.style.display="block";
    if(!below&&y-16-tip.offsetHeight<12){tip.className=(pin?"pin ":"")+"below";tip.style.top=(y+16)+"px"}
  }
  function hideTip(){$("tip").style.display="none"}
  function onGlass(e){return e.target.closest&&e.target.closest(".glass,#tip")}
  addEventListener("mousemove",function(e){
    if(onGlass(e)){hover=null;document.body.style.cursor="";if(!pinned)hideTip();return}
    var s=hit(e.clientX,e.clientY);hover=s?s.id:null;document.body.style.cursor=s?"pointer":"";
    if(!pinned){s?showTip(s,false):hideTip()}
  });
  addEventListener("click",function(e){
    if(onGlass(e))return;
    var s=hit(e.clientX,e.clientY);
    if(s){pinned=s.id;showTip(s,true)}else{pinned=null;hideTip()}
  });
  addEventListener("keydown",function(e){
    if(e.key==="Escape"){pinned=null;hideTip();if($("clearConfirm"))$("clearConfirm").hidden=true}
    if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("in").focus()}
  });
  var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){size();if(pinned){var ps=tasks.find(function(x){return x.id===pinned});if(ps&&ps.done)showTip(ps,true);else{pinned=null;hideTip()}}},120)});

  /* ---------- tasks ---------- */
  function add(text){text=text.trim();if(!text)return;tasks.unshift({id:uid(),text:text,created:Date.now(),done:null});write();render()}
  function settle(id,li){
    if(li.dataset.s)return;li.dataset.s="1";
    var hp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;
    if(hp&&typeof hp.impact==="function"){try{hp.impact({style:"LIGHT"})}catch(e){}}
    li.classList.add("rise");setTimeout(function(){var t=tasks.find(function(x){return x.id===id});if(t)t.done=Date.now();write();render()},520);
  }
  function restore(id){var t=tasks.find(function(x){return x.id===id});if(t){t.done=null;t.created=Date.now()}if(pinned===id){pinned=null;hideTip()}write();render()}
  function edit(id,span,li){
    if(li&&li.classList.contains("rise"))return;
    var t=tasks.find(function(x){return x.id===id});if(!t)return;
    var inp=document.createElement("input"),fin=false;
    inp.className="edit";inp.value=t.text;span.replaceWith(inp);inp.focus();inp.select();
    function end(save){if(fin)return;fin=true;if(save&&inp.value.trim()){t.text=inp.value.trim();write()}render()}
    inp.addEventListener("keydown",function(e){if(e.key==="Enter")end(true);if(e.key==="Escape")end(false)});
    inp.addEventListener("blur",function(){end(true)});
  }

  function render(){
    refreshCol();
    var open=tasks.filter(function(t){return !t.done}),done=stars().reverse(),n=done.length;
    var h=new Date().getHours();
    $("hello").textContent=h<5?"Still up?":h<12?"Good morning.":h<18?"Good afternoon.":"Good evening.";
    $("sub").textContent=(!open.length&&!n)?"The sky is empty. Every task you finish becomes a star."
      :!open.length?"Nothing left to do. "+n+(n===1?" star":" stars")+" and counting."
      :open.length+(open.length===1?" thing":" things")+" to do. "+n+(n===1?" star":" stars")+" in your sky.";
    $("hint").textContent=n?"Each star is something you finished. Tap or click one to reopen it.":"";
    $("skyBtn").hidden=!n;
    if(!n){document.body.classList.remove("sky");$("skyBtn").textContent="✦ Sky";$("skyBtn").setAttribute("aria-pressed","false")}

    var ul=$("open");ul.innerHTML="";
    if(!open.length){var e=document.createElement("li");e.className="empty";e.textContent=n?"All clear.":"Nothing here yet.";ul.appendChild(e)}
    open.forEach(function(t){
      var li=document.createElement("li");li.className="glass t";
      var b=document.createElement("button");b.className="chk";b.setAttribute("aria-label","Mark done: "+t.text);b.onclick=function(){settle(t.id,li)};
      var s=document.createElement("span");s.className="txt";s.textContent=t.text;s.title=coarse?"Tap to edit":"Double-click to edit";s.ondblclick=function(){edit(t.id,s,li)};if(coarse)s.onclick=function(){edit(t.id,s,li)};
      var a=document.createElement("span");a.className="age";a.textContent=ago(t.created);
      li.append(b,s,a);ul.appendChild(li);
    });

    $("archSum").textContent="Archive and backup ("+n+" kept forever)";
    $("clearDone").disabled=!n;
    if(!n&&$("clearConfirm"))$("clearConfirm").hidden=true;
    var dl=$("done");dl.innerHTML="";
    done.forEach(function(t){
      var li=document.createElement("li");li.className="d";
      var d=document.createElement("span");d.className="star";
      var s=document.createElement("span");s.className="txt";s.textContent=t.text;
      var a=document.createElement("span");a.className="age";a.textContent=dateLabel(t.done);
      var r=document.createElement("button");r.className="link";r.textContent="Reopen";r.onclick=function(){restore(t.id)};
      li.append(d,s,a,r);dl.appendChild(li);
    });
    if(reduce)draw(performance.now());
  }

  $("addBtn").onclick=function(){add($("in").value);$("in").value="";$("in").focus()};
  $("in").addEventListener("keydown",function(e){if(e.key==="Enter"){add(this.value);this.value=""}});
  $("reopen").onclick=function(){if(pinned)restore(pinned)};
  /* ---------- notes to tomorrow ---------- */
  var NKEY=KEY+".notes",notes=[],nmem=null;
  function readNotes(){try{var r=localStorage.getItem(NKEY),d=r?JSON.parse(r):null;if(Array.isArray(d))return d}catch(e){}try{var m=nmem?JSON.parse(nmem):null;if(Array.isArray(m))return m}catch(e){}return[]}
  function writeNotes(){var s=JSON.stringify(notes);nmem=s;try{localStorage.setItem(NKEY,s)}catch(e){}}
  function dayDiff(ts){var a=new Date(ts),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
  function when(ts){var d=dayDiff(ts);return d<=0?"earlier today":d===1?"yesterday":d+" days ago"}
  function renderNotes(){
    var sorted=notes.slice().sort(function(a,b){return b.at-a.at});
    var past=sorted.filter(function(n){return dayDiff(n.at)>=1})[0],p=$("note");
    p.innerHTML="";
    if(past){
      var q=document.createElement("b");q.className="q";q.textContent="“"+past.text+"”";
      var sm=document.createElement("small");sm.textContent="From you, "+when(past.at);
      p.append(q,sm);p.hidden=false;
    }else p.hidden=true;
    var ul=$("notes");ul.innerHTML="";
    sorted.forEach(function(n){
      var li=document.createElement("li");li.className="n";
      var b=document.createElement("b");b.textContent=n.text;
      var sm=document.createElement("small");sm.textContent=new Date(n.at).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      li.append(b,sm);ul.appendChild(li);
    });
    $("noteSum").textContent=notes.length?"Note to tomorrow ("+notes.length+" kept)":"Note to tomorrow";
  }
  function leave(){
    var box=$("box"),t=box.value.trim(),m=$("bmsg");
    if(!t){m.textContent="Write a line first.";return}
    notes.push({id:uid(),text:t,at:Date.now()});writeNotes();box.value="";
    try{localStorage.removeItem(KEY+".draft")}catch(e){}
    renderNotes();m.textContent="Saved. It will greet you tomorrow.";
  }
  $("leave").onclick=leave;
  $("skyBtn").onclick=function(){
    var on=document.body.classList.toggle("sky");
    this.textContent=on?"Tasks":"✦ Sky";this.setAttribute("aria-pressed",on?"true":"false");
    pinned=null;hideTip();
  };
  $("box").addEventListener("input",function(){$("bmsg").textContent="It greets you here tomorrow. Ctrl+Enter also works.";try{localStorage.setItem(KEY+".draft",this.value)}catch(e){}});
  $("box").addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();leave()}});
  try{var dr=localStorage.getItem(KEY+".draft");if(dr)$("box").value=dr}catch(e){}

  /* ---------- backup ---------- */
  $("copy").onclick=function(){
    var s=JSON.stringify({v:2,tasks:tasks,notes:notes},null,1),m=$("msg");
    function ok(){m.textContent="Backup copied. Paste it somewhere safe."}
    function fallback(){$("rbox").hidden=false;var b=$("rtext");b.value=s;b.focus();b.select();m.textContent="Copying isn’t allowed here. Press Ctrl+C or ⌘C to copy the selected text."}
    function tryNav(){try{navigator.clipboard.writeText(s).then(ok,fallback)}catch(e){fallback()}}
    var capClip=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Clipboard;
    if(capClip&&typeof capClip.write==="function"){try{capClip.write({string:s}).then(ok,tryNav)}catch(e){tryNav()}}else tryNav();
  };
  $("save").onclick=function(){
    var s=JSON.stringify({v:2,tasks:tasks,notes:notes},null,1),m=$("msg");
    var name="sediment-backup-"+new Date().toISOString().slice(0,10)+".json";
    function dl(){
      try{
        var u=URL.createObjectURL(new Blob([s],{type:"application/json"}));
        var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},1000);
        m.textContent="Backup downloaded.";
      }catch(e){m.textContent="Couldn’t save file. Try Copy backup instead."}
    }
    var cp=window.Capacitor&&window.Capacitor.Plugins;
    if(isNative&&cp&&cp.Share&&typeof cp.Share.share==="function"){
      var sh=cp.Share,fs=cp.Filesystem;
      function shareText(){sh.share({title:"Sediment backup",text:s,dialogTitle:"Save or share backup"}).then(function(){m.textContent="Backup shared."},function(){})}
      if(fs&&typeof fs.writeFile==="function"){
        fs.writeFile({path:name,data:s,directory:"CACHE",encoding:"utf8"}).then(function(r){
          sh.share({title:"Sediment backup",files:[r.uri],dialogTitle:"Save or share backup"}).then(function(){m.textContent="Backup saved or shared."},function(err){
            if(err&&/cancel/i.test(String(err.message||err)))return;
            shareText();
          });
        },shareText);
      }else shareText();
    }else dl();
  };
  $("clearDone").onclick=function(){
    var count=stars().length;
    if(!count)return;
    $("clearPrompt").textContent="Delete "+count+" completed "+(count===1?"task":"tasks")+" and remove "+(count===1?"its":"their")+" "+(count===1?"star":"stars")+"? This can’t be undone unless you saved a backup.";
    $("clearConfirm").hidden=false;
    $("clearYes").focus();
  };
  $("clearNo").onclick=function(){
    $("clearConfirm").hidden=true;
    $("clearDone").focus();
  };
  $("clearYes").onclick=function(){
    var count=stars().length;
    $("clearConfirm").hidden=true;
    if(!count)return;
    tasks=tasks.filter(function(t){return !t.done});
    pinned=null;hover=null;hideTip();
    write();render();
    $("msg").textContent="Deleted "+count+" completed "+(count===1?"task.":"tasks.")+" Saved backup files are unchanged.";
  };
  $("restoreBtn").onclick=function(){$("rbox").hidden=false;$("rtext").focus()};
  $("restoreX").onclick=function(){$("rbox").hidden=true;$("rtext").value="";$("msg").textContent="A backup holds your tasks and notes."};
  $("rtext").addEventListener("input",function(){$("msg").textContent="A backup holds your tasks and notes."});
  function parseTs(v,fb){if(typeof v==="number"&&isFinite(v)&&v>0)return v;var n=+v;if(isFinite(n)&&n>0)return n;if(typeof v==="string"){var d=Date.parse(v);if(isFinite(d)&&d>0)return d}return fb}
  $("restoreGo").onclick=function(){
    var m=$("msg"),data;
    try{data=JSON.parse($("rtext").value)}catch(e){m.textContent="That text isn’t a valid backup.";return}
    var ts=Array.isArray(data)?data:(data&&data.tasks),ns=data&&data.notes;
    if(!Array.isArray(ts)&&!Array.isArray(ns)){m.textContent="That text isn’t a valid backup.";return}
    ts=Array.isArray(ts)?ts:[];ns=Array.isArray(ns)?ns:[];
    var ids={},nids={},a=0,b=0;
    tasks.forEach(function(t){ids[String(t.id)]=1});notes.forEach(function(n){nids[String(n.id)]=1});
    ts.forEach(function(t){var k=t&&t.id!=null?String(t.id):"",tx=t&&t.text!=null?String(t.text).trim():"";if(k&&tx&&!ids[k]){ids[k]=1;tasks.push({id:k,text:tx,created:parseTs(t.created,Date.now()),done:t.done?parseTs(t.done,null):null});a++}});
    ns.forEach(function(n){var k=n&&n.id!=null?String(n.id):"",tx=n&&n.text!=null?String(n.text).trim():"";if(k&&tx&&!nids[k]){nids[k]=1;notes.push({id:k,text:tx,at:parseTs(n.at,Date.now())});b++}});
    write();writeNotes();render();renderNotes();
    $("rbox").hidden=true;$("rtext").value="";
    m.textContent=(a||b)?"Restored "+a+(a===1?" task":" tasks")+" and "+b+(b===1?" note.":" notes."):"Nothing new to restore. You already have everything.";
  };

  var root=document.documentElement,dark=matchMedia("(prefers-color-scheme: dark)").matches;
  try{var th=localStorage.getItem(KEY+".theme");if(th==="dark"||th==="light"){root.setAttribute("data-theme",th);dark=th==="dark"}}catch(e){}

  /* ---------- native & offline ---------- */
  var cap=window.Capacitor,isNative=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());
  function syncThemeBars(){
    if(!isNative||!cap.Plugins)return;
    var sb=cap.Plugins.StatusBar,sys=cap.Plugins.SystemBars;
    var bg=dark?"#080919":"#f4ecfa",st=dark?"DARK":"LIGHT";
    if(sb){try{sb.setBackgroundColor({color:bg});sb.setStyle({style:st})}catch(e){}}
    if(sys&&typeof sys.setStyle==="function"){try{sys.setStyle({style:st})}catch(e){}}
  }
  $("theme").onclick=function(){dark=!dark;root.setAttribute("data-theme",dark?"dark":"light");try{localStorage.setItem(KEY+".theme",dark?"dark":"light")}catch(e){}refreshCol();syncThemeBars();if(reduce)draw(performance.now())};
  matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){setTimeout(function(){if(!localStorage.getItem(KEY+".theme")){dark=matchMedia("(prefers-color-scheme: dark)").matches;syncThemeBars()}refreshCol();if(reduce)draw(performance.now())},50)});
  var kfT=0;function focusScroll(el,delay){if(!el||!/INPUT|TEXTAREA/.test(el.tagName))return;clearTimeout(kfT);kfT=setTimeout(function(){el.scrollIntoView({block:"center",behavior:"smooth"})},delay)}
  if(isNative&&cap.Plugins){
    var sp=cap.Plugins.SplashScreen,ca=cap.Plugins.App,kb=cap.Plugins.Keyboard;
    syncThemeBars();
    if(ca&&ca.addListener){
      ca.addListener("backButton",function(){
        var ed=document.querySelector(".edit");if(ed){ed.blur();return}
        if(pinned){pinned=null;hideTip();return}
        if(document.body.classList.contains("sky")){document.body.classList.remove("sky");$("skyBtn").textContent="✦ Sky";$("skyBtn").setAttribute("aria-pressed","false");return}
        if(!$("rbox").hidden){$("rbox").hidden=true;$("rtext").value="";$("msg").textContent="A backup holds your tasks and notes.";return}
        if($("archWrap")&&$("archWrap").open){$("archWrap").open=false;return}
        ca.exitApp();
      });
      ca.addListener("appStateChange",function(s){if(s&&s.isActive){scrolling=false;document.body.classList.remove("scrolling");if(!document.querySelector(".edit"))render();renderNotes()}});
    }
    if(kb&&kb.addListener){
      kb.addListener("keyboardWillShow",function(info){
        root.style.setProperty("--kb",(info&&info.keyboardHeight?info.keyboardHeight:280)+"px");
        focusScroll(document.activeElement,120);
      });
      kb.addListener("keyboardWillHide",function(){root.style.setProperty("--kb","0px")});
    }
    if(sp){try{sp.hide()}catch(e){}}
  }
  addEventListener("focusin",function(e){focusScroll(e.target,250)});
  if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol)&&!isNative){
    var hadCtrl=!!navigator.serviceWorker.controller,reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtrl&&!reloaded){reloaded=true;location.reload()}});
    addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").then(function(r){r.update()}).catch(function(){})});
  }

  var ready=false;size();tasks=read();notes=readNotes();ready=true;render();renderNotes();requestAnimationFrame(loop);
  setInterval(function(){if(!document.querySelector(".edit"))render();renderNotes()},60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){scrolling=false;document.body.classList.remove("scrolling");if(!document.querySelector(".edit"))render();renderNotes()}});
})();
</script>
</body>
