<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ecfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sediment">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sediment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --base:#f4ecfa;--ink:#2a2147;--mute:#7a6e99;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85);--tipbg:rgba(255,255,255,.85);
  --b1:#ffae98;--b2:#b7a4ff;--b3:#93e4dd;--bo:.6;--star:#3b2a78;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--base:#080919;--ink:#f2efff;--mute:#9c99c8;--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.14);--tipbg:rgba(20,18,50,.85);--b1:#d23fa0;--b2:#5a3df0;--b3:#0f9fbd;--bo:.5;--star:#ffe3b3;color-scheme:dark}
}
:root[data-theme="dark"]{--base:#080919;--ink:#f2efff;--mute:#9c99c8;--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.14);--tipbg:rgba(20,18,50,.85);--b1:#d23fa0;--b2:#5a3df0;--b3:#0f9fbd;--bo:.5;--star:#ffe3b3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--base);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--bo);animation:drift 30s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:var(--b2)}
.aurora i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:8vh;background:var(--b1);animation-duration:38s}
.aurora i:nth-child(3){width:55vmax;height:55vmax;left:18vw;bottom:-32vmax;background:var(--b3);animation-duration:46s}
@keyframes drift{to{transform:translate(7vw,-5vh) scale(1.15)}}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sky{position:fixed;inset:0;z-index:1}
main{position:relative;z-index:2;max-width:580px;margin:0 auto;padding:13vh 22px 120px;pointer-events:none}
header{margin-bottom:40px}
h1{font:400 clamp(52px,10vw,92px)/.95 var(--serif);letter-spacing:-.025em;margin:0 0 16px}
.sub{margin:0;color:var(--mute);font-size:17px;max-width:420px}
.glass{pointer-events:auto;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 18px 50px -24px rgba(20,10,60,.45)}
.add{display:flex;align-items:center;gap:12px;border-radius:40px;padding:8px 8px 8px 28px;transition:box-shadow .25s}
.add:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--b2) 35%,transparent),0 18px 50px -24px rgba(20,10,60,.45)}
.add input{flex:1;border:0;background:none;outline:none;color:var(--ink);font:inherit;font-size:19px;padding:14px 0;min-width:0}
.add input::placeholder{color:var(--mute)}
.add button{flex:none;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;color:#fff;font:300 28px/1 var(--sans);background:linear-gradient(135deg,var(--b2),var(--b1));transition:transform .2s}
.add button:hover{transform:rotate(90deg) scale(1.06)}
ul{list-style:none;margin:22px 0 0;padding:0;pointer-events:none}
li.t{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:24px;margin-bottom:10px}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mute);background:none;cursor:pointer;padding:0;transition:all .25s}
.chk:hover{border-color:transparent;background:linear-gradient(135deg,var(--b2),var(--b1));box-shadow:0 0 18px color-mix(in srgb,var(--b1) 60%,transparent)}
.txt{flex:1;font-size:19px;cursor:text;word-break:break-word}
.edit{flex:1;font:inherit;font-size:19px;background:none;border:0;border-bottom:1px solid var(--b2);color:var(--ink);outline:none;padding:0;min-width:0}
.age{color:var(--mute);font-size:13px;white-space:nowrap}
li.rise{animation:rise .55s ease forwards}
@keyframes rise{to{opacity:0;transform:translateY(-30px) scale(.96);filter:blur(8px)}}
.empty{color:var(--mute);font:italic 400 24px/1.3 var(--serif);padding:24px 8px;pointer-events:none}
.arch{border-radius:24px;margin-top:34px;padding:16px 22px}
summary{cursor:pointer;color:var(--mute);font-size:14px;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details[open]>summary::before{transform:rotate(45deg)}
.arch ul{margin:14px 0 0}
li.d{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--edge);color:var(--mute);pointer-events:auto}
li.d .txt{cursor:default;font-size:16px}
.star{flex:none;width:8px;height:8px;border-radius:50%;background:var(--star);box-shadow:0 0 10px var(--star)}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px}
.link:hover{color:var(--ink)}
.bk{margin-top:16px;border-top:1px solid var(--edge);padding-top:14px}
textarea{display:block;width:100%;min-height:110px;margin-top:14px;background:transparent;border:1px solid var(--edge);border-radius:14px;color:var(--ink);font:16px/1.5 var(--sans);padding:12px 14px;resize:vertical;outline:none}
textarea:focus{border-color:var(--b2);box-shadow:0 0 0 3px color-mix(in srgb,var(--b2) 30%,transparent)}
textarea::placeholder{color:var(--mute)}
.arch+.arch{margin-top:12px}
.note{margin:22px 0 0;max-width:470px}
.note .q{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font:italic 400 24px/1.3 var(--serif);white-space:pre-wrap;word-break:break-word}
.note small{display:block;margin-top:8px;color:var(--mute);font-size:13px}
#notes{max-height:230px;overflow:auto;margin:14px 0 0;pointer-events:auto}
#notes:empty{display:none}
li.n{padding:12px 0;border-top:1px solid var(--edge);pointer-events:auto}
li.n b{display:block;font:400 18px/1.35 var(--serif);color:var(--ink);white-space:pre-wrap;word-break:break-word}
li.n small{color:var(--mute);font-size:12px}
.row{display:flex;gap:16px;margin-top:8px;align-items:center}
.msg{color:var(--mute);font-size:13px}
.theme{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:20px;z-index:6;width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:16px;padding:0}
.hint{position:fixed;left:24px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2;margin:0;font-size:13px;color:var(--mute);pointer-events:none;max-width:60vw}
#tip{position:fixed;z-index:5;display:none;transform:translate(-50%,-100%);max-width:260px;padding:12px 16px;border-radius:16px;background:var(--tipbg);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:none;box-shadow:0 14px 40px -12px rgba(0,0,0,.5)}
#tip.below{transform:translate(-50%,0)}
#tip.pin{pointer-events:auto}
#tip b{display:block;font:400 20px/1.2 var(--serif);word-break:break-word}
#tip small{color:var(--mute);font-size:12px}
#tip .link{display:block;margin-top:6px;padding:0}
.chk:focus-visible,.theme:focus-visible,.add button:focus-visible,.link:focus-visible,summary:focus-visible{outline:2px solid var(--b2);outline-offset:3px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.aurora i{will-change:transform}
main{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));transition:opacity .45s}
.skybtn{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;height:44px;padding:0 18px;border-radius:22px;cursor:pointer;color:var(--ink);font:500 14px var(--sans)}
body.sky main{opacity:0}
body.sky main .glass{pointer-events:none}
body.sky .hint{display:block}
@media (max-width:640px){
  main{padding-top:9vh;padding-bottom:110px}
  header{margin-bottom:28px}
  h1{font-size:clamp(44px,14vw,60px)}
  .sub{font-size:16px}
  .note .q{font-size:21px}
  .add{padding:6px 6px 6px 22px}
  .add input{font-size:18px}
  li.t{padding:16px 18px;gap:14px}
  .age{display:none}
  .arch{padding:14px 18px}
  .aurora i{filter:blur(60px)}
  .glass{backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
  .hint{display:none}
  .theme,.skybtn{right:14px}
}
@media (pointer:coarse){
  .chk{width:30px;height:30px;position:relative}
  .chk::after{content:"";position:absolute;inset:-10px}
  .link{padding:10px 6px;font-size:14px}
  .theme{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="sky"></canvas>
<button class="glass theme" id="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
<button class="glass skybtn" id="skyBtn" aria-pressed="false" hidden>✦ Sky</button>

<main>
  <header>
    <h1 id="hello">Hello.</h1>
    <p class="sub" id="sub"></p>
    <p class="note" id="note" hidden></p>
  </header>

  <div class="glass add">
    <input id="in" type="text" placeholder="Add something…" autocomplete="off" aria-label="New task">
    <button id="addBtn" aria-label="Add task">+</button>
  </div>

  <ul id="open"></ul>

  <details class="glass arch" id="noteWrap" open>
    <summary id="noteSum">Note to tomorrow</summary>
    <textarea id="box" spellcheck="false" maxlength="600" aria-label="Note to tomorrow" placeholder="What should tomorrow-you remember, finish or feel?"></textarea>
    <div class="row">
      <button class="link" id="leave">Leave note</button>
      <span class="msg" id="bmsg">It greets you here tomorrow. Ctrl+Enter also works.</span>
    </div>
    <ul id="notes"></ul>
  </details>

  <details class="glass arch">
    <summary id="archSum"></summary>
    <ul id="done"></ul>
    <div class="bk">
      <div class="row">
        <button class="link" id="copy">Copy backup</button>
        <button class="link" id="restoreBtn">Restore backup</button>
        <span class="msg" id="msg">A backup holds your tasks and notes.</span>
      </div>
      <div id="rbox" hidden>
        <textarea id="rtext" spellcheck="false" aria-label="Paste backup" placeholder="Paste your backup text here."></textarea>
        <div class="row"><button class="link" id="restoreGo">Restore now</button><button class="link" id="restoreX">Cancel</button></div>
      </div>
    </div>
  </details>
</main>

<div id="tip"><b id="tipText"></b><small id="tipDate"></small><button class="link" id="reopen">Reopen task</button></div>
<p class="hint" id="hint"></p>

<script>
(function(){
  var KEY="sediment.v1",mem=null,tasks=[],hover=null,pinned=null,cache={},starCol="#fff";
  var $=function(i){return document.getElementById(i)};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,coarse=matchMedia("(pointer:coarse)").matches;

  function read(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem?JSON.parse(mem):[]}
  function write(){var s=JSON.stringify(tasks);mem=s;try{localStorage.setItem(KEY,s)}catch(e){}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function ago(ts){var m=Math.floor((Date.now()-ts)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.floor(m/60);if(h<24)return h+(h===1?" hour ago":" hours ago");var d=Math.floor(h/24);return d+(d===1?" day ago":" days ago")}
  function dateLabel(ts){return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})}

  /* ---------- sky ---------- */
  var cv=$("sky"),cx=cv.getContext("2d"),W=0,H=0;
  var dust=(function(){var r=rng(7),a=[];for(var i=0;i<150;i++)a.push({x:r(),y:r(),s:.4+r()*.9,p:r()*6.28});return a})();
  function size(){var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(d,0,0,d,0,0)}
  function refreshCol(){starCol=getComputedStyle(document.documentElement).getPropertyValue("--star").trim()||"#fff"}
  function pos(t){if(!cache[t.id]){var r=rng(hash(t.id));cache[t.id]={x:.05+.9*r(),y:.06+.88*r(),s:2.4+r()*2.2,p:r()*6.28}}return cache[t.id]}
  function stars(){return tasks.filter(function(t){return t.done}).sort(function(a,b){return a.done-b.done})}

  function draw(t){
    cx.clearRect(0,0,W,H);cx.fillStyle=starCol;cx.strokeStyle=starCol;
    dust.forEach(function(d){cx.globalAlpha=.12+.22*(.5+.5*Math.sin(t*.0008+d.p));cx.beginPath();cx.arc(d.x*W,d.y*H,d.s,0,6.283);cx.fill()});
    var list=stars();
    cx.globalAlpha=.17;cx.lineWidth=1;cx.beginPath();
    list.forEach(function(s,i){var p=pos(s);i?cx.lineTo(p.x*W,p.y*H):cx.moveTo(p.x*W,p.y*H)});
    cx.stroke();
    cx.shadowColor=starCol;cx.shadowBlur=16;
    list.forEach(function(s){
      var p=pos(s),age=Date.now()-s.done,boost=age<2500?1+3*Math.exp(-age/500):1;
      cx.globalAlpha=.82+.18*Math.sin(t*.002+p.p);
      cx.beginPath();cx.arc(p.x*W,p.y*H,p.s*boost,0,6.283);cx.fill();
    });
    cx.shadowBlur=0;
    var hl=pinned||hover;
    if(hl){var s=tasks.find(function(x){return x.id===hl});if(s&&s.done){var p=pos(s);cx.globalAlpha=.6;cx.lineWidth=1.2;cx.beginPath();cx.arc(p.x*W,p.y*H,p.s+8,0,6.283);cx.stroke()}}
    cx.globalAlpha=1;
  }
  var last=0;
  function loop(t){if(t-last>=32){last=t;draw(t)}if(!reduce)requestAnimationFrame(loop)}

  function hit(mx,my){var best=null,bd=coarse?30:18;stars().forEach(function(s){var p=pos(s),d=Math.hypot(p.x*W-mx,p.y*H-my);if(d<bd){bd=d;best=s}});return best}
  function showTip(s,pin){
    var p=pos(s),tip=$("tip"),y=p.y*H;
    $("tipText").textContent=s.text;$("tipDate").textContent="Finished "+dateLabel(s.done);
    $("reopen").style.display=pin?"":"none";
    tip.className=(pin?"pin ":"")+(y<110?"below":"");
    tip.style.left=Math.min(Math.max(p.x*W,140),W-140)+"px";tip.style.top=(y<110?y+16:y-16)+"px";tip.style.display="block";
  }
  function hideTip(){$("tip").style.display="none"}
  function onGlass(e){return e.target.closest&&e.target.closest(".glass,#tip")}
  addEventListener("mousemove",function(e){
    if(onGlass(e)){hover=null;document.body.style.cursor="";if(!pinned)hideTip();return}
    var s=hit(e.clientX,e.clientY);hover=s?s.id:null;document.body.style.cursor=s?"pointer":"";
    if(!pinned){s?showTip(s,false):hideTip()}
  });
  addEventListener("click",function(e){
    if(onGlass(e))return;
    var s=hit(e.clientX,e.clientY);
    if(s){pinned=s.id;showTip(s,true)}else{pinned=null;hideTip()}
  });
  addEventListener("keydown",function(e){
    if(e.key==="Escape"){pinned=null;hideTip()}
    if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("in").focus()}
  });
  var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(size,120)});

  /* ---------- tasks ---------- */
  function add(text){text=text.trim();if(!text)return;tasks.unshift({id:uid(),text:text,created:Date.now(),done:null});write();render()}
  function settle(id,li){li.classList.add("rise");setTimeout(function(){var t=tasks.find(function(x){return x.id===id});if(t)t.done=Date.now();write();render()},520)}
  function restore(id){var t=tasks.find(function(x){return x.id===id});if(t){t.done=null;t.created=Date.now()}if(pinned===id){pinned=null;hideTip()}write();render()}
  function edit(id,span){
    var t=tasks.find(function(x){return x.id===id}),inp=document.createElement("input"),fin=false;
    inp.className="edit";inp.value=t.text;span.replaceWith(inp);inp.focus();inp.select();
    function end(save){if(fin)return;fin=true;if(save&&inp.value.trim()){t.text=inp.value.trim();write()}render()}
    inp.addEventListener("keydown",function(e){if(e.key==="Enter")end(true);if(e.key==="Escape")end(false)});
    inp.addEventListener("blur",function(){end(true)});
  }

  function render(){
    refreshCol();
    var open=tasks.filter(function(t){return !t.done}),done=stars().reverse(),n=done.length;
    var h=new Date().getHours();
    $("hello").textContent=h<5?"Still up?":h<12?"Good morning.":h<18?"Good afternoon.":"Good evening.";
    $("sub").textContent=(!open.length&&!n)?"The sky is empty. Every task you finish becomes a star."
      :!open.length?"Nothing left to do. "+n+(n===1?" star":" stars")+" and counting."
      :open.length+(open.length===1?" thing":" things")+" to do. "+n+(n===1?" star":" stars")+" in your sky.";
    $("hint").textContent=n?"Each star is something you finished. Tap or click one to reopen it.":"";
    $("skyBtn").hidden=!n;
    if(!n){document.body.classList.remove("sky");$("skyBtn").textContent="✦ Sky";$("skyBtn").setAttribute("aria-pressed","false")}

    var ul=$("open");ul.innerHTML="";
    if(!open.length){var e=document.createElement("li");e.className="empty";e.textContent=n?"All clear.":"Nothing here yet.";ul.appendChild(e)}
    open.forEach(function(t){
      var li=document.createElement("li");li.className="glass t";
      var b=document.createElement("button");b.className="chk";b.setAttribute("aria-label","Mark done: "+t.text);b.onclick=function(){settle(t.id,li)};
      var s=document.createElement("span");s.className="txt";s.textContent=t.text;s.title=coarse?"Tap to edit":"Double-click to edit";s.ondblclick=function(){edit(t.id,s)};if(coarse)s.onclick=function(){edit(t.id,s)};
      var a=document.createElement("span");a.className="age";a.textContent=ago(t.created);
      li.append(b,s,a);ul.appendChild(li);
    });

    $("archSum").textContent="Archive and backup ("+n+" kept forever)";
    var dl=$("done");dl.innerHTML="";
    done.forEach(function(t){
      var li=document.createElement("li");li.className="d";
      var d=document.createElement("span");d.className="star";
      var s=document.createElement("span");s.className="txt";s.textContent=t.text;
      var a=document.createElement("span");a.className="age";a.textContent=dateLabel(t.done);
      var r=document.createElement("button");r.className="link";r.textContent="Reopen";r.onclick=function(){restore(t.id)};
      li.append(d,s,a,r);dl.appendChild(li);
    });
    if(reduce)draw(performance.now());
  }

  $("addBtn").onclick=function(){add($("in").value);$("in").value="";$("in").focus()};
  $("in").addEventListener("keydown",function(e){if(e.key==="Enter"){add(this.value);this.value=""}});
  $("reopen").onclick=function(){if(pinned)restore(pinned)};
  /* ---------- notes to tomorrow ---------- */
  var NKEY=KEY+".notes",notes=[],nmem=null;
  function readNotes(){try{var r=localStorage.getItem(NKEY);if(r)return JSON.parse(r)}catch(e){}return nmem?JSON.parse(nmem):[]}
  function writeNotes(){var s=JSON.stringify(notes);nmem=s;try{localStorage.setItem(NKEY,s)}catch(e){}}
  function dayDiff(ts){var a=new Date(ts),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
  function when(ts){var d=dayDiff(ts);return d<=0?"earlier today":d===1?"yesterday":d+" days ago"}
  function renderNotes(){
    var sorted=notes.slice().sort(function(a,b){return b.at-a.at});
    var past=sorted.filter(function(n){return dayDiff(n.at)>=1})[0],p=$("note");
    p.innerHTML="";
    if(past){
      var q=document.createElement("b");q.className="q";q.textContent="“"+past.text+"”";
      var sm=document.createElement("small");sm.textContent="From you, "+when(past.at);
      p.append(q,sm);p.hidden=false;
    }else p.hidden=true;
    var ul=$("notes");ul.innerHTML="";
    sorted.forEach(function(n){
      var li=document.createElement("li");li.className="n";
      var b=document.createElement("b");b.textContent=n.text;
      var sm=document.createElement("small");sm.textContent=new Date(n.at).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      li.append(b,sm);ul.appendChild(li);
    });
    $("noteSum").textContent=notes.length?"Note to tomorrow ("+notes.length+" kept)":"Note to tomorrow";
  }
  function leave(){
    var box=$("box"),t=box.value.trim(),m=$("bmsg");
    if(!t){m.textContent="Write a line first.";return}
    notes.push({id:uid(),text:t,at:Date.now()});writeNotes();box.value="";
    try{localStorage.removeItem(KEY+".draft")}catch(e){}
    renderNotes();m.textContent="Saved. It will greet you tomorrow.";
  }
  $("leave").onclick=leave;
  $("skyBtn").onclick=function(){
    var on=document.body.classList.toggle("sky");
    this.textContent=on?"Tasks":"✦ Sky";this.setAttribute("aria-pressed",on?"true":"false");
    pinned=null;hideTip();
  };
  $("box").addEventListener("input",function(){try{localStorage.setItem(KEY+".draft",this.value)}catch(e){}});
  $("box").addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();leave()}});
  try{var dr=localStorage.getItem(KEY+".draft");if(dr)$("box").value=dr}catch(e){}

  /* ---------- backup ---------- */
  $("copy").onclick=function(){
    var s=JSON.stringify({v:2,tasks:tasks,notes:notes},null,1),m=$("msg");
    function fallback(){$("rbox").hidden=false;var b=$("rtext");b.value=s;b.focus();b.select();m.textContent="Copying isn’t allowed here. Press Ctrl+C or ⌘C to copy the selected text."}
    try{navigator.clipboard.writeText(s).then(function(){m.textContent="Backup copied. Paste it somewhere safe."},fallback)}catch(e){fallback()}
  };
  $("restoreBtn").onclick=function(){$("rbox").hidden=false;$("rtext").focus()};
  $("restoreX").onclick=function(){$("rbox").hidden=true;$("rtext").value=""};
  $("restoreGo").onclick=function(){
    var m=$("msg"),data;
    try{data=JSON.parse($("rtext").value)}catch(e){m.textContent="That text isn’t a valid backup.";return}
    var ts=Array.isArray(data)?data:(data&&data.tasks),ns=data&&data.notes;
    if(!Array.isArray(ts)&&!Array.isArray(ns)){m.textContent="That text isn’t a valid backup.";return}
    ts=Array.isArray(ts)?ts:[];ns=Array.isArray(ns)?ns:[];
    var ids={},nids={},a=0,b=0;
    tasks.forEach(function(t){ids[t.id]=1});notes.forEach(function(n){nids[n.id]=1});
    ts.forEach(function(t){if(t&&t.id&&t.text&&!ids[t.id]){tasks.push({id:String(t.id),text:String(t.text),created:+t.created||Date.now(),done:t.done?+t.done:null});a++}});
    ns.forEach(function(n){if(n&&n.id&&n.text&&!nids[n.id]){notes.push({id:String(n.id),text:String(n.text),at:+n.at||Date.now()});b++}});
    write();writeNotes();render();renderNotes();
    $("rbox").hidden=true;$("rtext").value="";
    m.textContent=(a||b)?"Restored "+a+(a===1?" task":" tasks")+" and "+b+(b===1?" note.":" notes."):"Nothing new to restore. You already have everything.";
  };

  var root=document.documentElement,dark=matchMedia("(prefers-color-scheme: dark)").matches;
  try{var th=localStorage.getItem(KEY+".theme");if(th){root.setAttribute("data-theme",th);dark=th==="dark"}}catch(e){}
  $("theme").onclick=function(){dark=!dark;root.setAttribute("data-theme",dark?"dark":"light");try{localStorage.setItem(KEY+".theme",dark?"dark":"light")}catch(e){}refreshCol();if(reduce)draw(performance.now())};
  matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){setTimeout(function(){refreshCol()},50)});

  size();tasks=read();notes=readNotes();render();renderNotes();requestAnimationFrame(loop);
  setInterval(function(){render();renderNotes()},60000);
})();
</script>
</body>
</html>
